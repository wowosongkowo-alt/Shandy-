<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpace — Your Learning Space</title>

    <style>
        /* =========================
           RESET & GLOBAL
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #60a5fa;
            --background: #f4f8ff;
            --card: #ffffff;
            --text: #172554;
            --muted: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --danger: #ef4444;
            --sidebar: #ffffff;
            --shadow: 0 10px 30px rgba(37, 99, 235, 0.08);
        }

        body.dark {
            --background: #0f172a;
            --card: #172033;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #26344d;
            --sidebar: #111827;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        body {
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            transition: 0.3s ease;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
            border: none;
        }

        /* =========================
           LAYOUT
        ========================== */

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* =========================
           SIDEBAR
        ========================== */

        .sidebar {
            width: 250px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            padding: 25px 18px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
            transition: 0.3s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
            padding-left: 8px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .logo h2 {
            font-size: 21px;
        }

        .logo span {
            color: var(--primary);
        }

        .menu-title {
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 12px;
            margin-bottom: 10px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
